<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мій кабінет — SkillBox AI</title><style>body{margin:0;background:#0e101c;color:#f3f1ff;font:16px system-ui}main{max-width:650px;margin:8vh auto;padding:24px}a{color:#bca4ff}.panel{background:#1b1b30;padding:28px;border:1px solid #41405d;border-radius:20px}input,button{padding:13px;border-radius:10px;font:inherit}input{background:#121322;color:white;border:1px solid #656080;width:100%;box-sizing:border-box}button{background:#8056ed;color:white;border:0;margin-top:14px;cursor:pointer}#message{color:#c7c0dd}li{margin:10px 0}</style></head><body><main><a href="./">← До магазину</a><h1>Особистий кабінет</h1><div class="panel"><section id="login"><p>Введіть електронну пошту. Ми надішлемо посилання для входу.</p><form id="form"><label for="email">Електронна пошта</label><input type="email" id="email" required autocomplete="email" placeholder="you@example.com"><button>Надіслати посилання</button></form></section><section id="profile" hidden><p id="identity"></p><h2>Мої покупки</h2><ul id="orders"></ul><h2>Доступні матеріали</h2><ul id="library"></ul><button id="logout">Вийти</button></section><p id="message" role="status"></p></div></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient("https://lmdscbskgnxekhslzqso.supabase.co","sb_publishable_jsVNOcMtyoE8xa9EI6MGTw_xqZjhRk_");const $=id=>document.getElementById(id),msg=s=>$("message").textContent=s;async function refresh(){const {data:{user},error}=await db.auth.getUser();$("login").hidden=!!user;$("profile").hidden=!user;if(!user)return;if(error){msg(error.message);return}$("identity").textContent="Вхід виконано: "+user.email;const [o,e]=await Promise.all([db.from("skillbox_orders").select("id,status,total_uah,created_at").order("created_at",{ascending:false}),db.from("skillbox_entitlements").select("product_id,granted_at")]);if(o.error||e.error){msg("Не вдалося завантажити покупки. Спробуйте пізніше.");return}const render=(id,rows,empty,format)=>{const ul=$(id);ul.replaceChildren();if(!rows.length){const li=document.createElement("li");li.textContent=empty;ul.append(li)}else rows.forEach(x=>{const li=document.createElement("li");li.textContent=format(x);ul.append(li)})};render("orders",o.data||[],"Покупок поки немає.",x=>x.id.slice(0,8)+" · "+x.status+" · "+x.total_uah+" грн");render("library",e.data||[],"Придбаних матеріалів поки немає.",x=>x.product_id)}$("form").addEventListener("submit",async ev=>{ev.preventDefault();msg("Надсилаємо лист...");const email=$("email").value.trim();const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});msg(error?"Помилка: "+error.message:"Перевірте пошту: посилання для входу надіслано, якщо відправлення дозволено.")});$("logout").addEventListener("click",async()=>{await db.auth.signOut();msg("Ви вийшли з акаунта.");await refresh()});db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></body></html>
